name: Research and ROS checks
on: [push, pull_request, workflow_dispatch]
jobs:
  algorithms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.5.4 torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s ros2_ws/src/delivery_robot/test -v
        env:
          PYTHONPATH: ros2_ws/src/delivery_robot
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: ros2_ws/src/delivery_robot
      - run: |
          python -m research.synthetic_fixture /tmp/synthetic-trajectories
          python -m research.train --manifest /tmp/synthetic-trajectories/manifest.json --kind gru --epochs 2 --output /tmp/synthetic-training
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-software-test-not-pedestrian-benchmark
          path: /tmp/synthetic-training
  jazzy:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential python3-colcon-common-extensions python3-pytest ros-jazzy-rosidl-default-generators ros-jazzy-launch-ros ros-jazzy-geometry-msgs ros-jazzy-nav-msgs ros-jazzy-sensor-msgs
      - shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build --symlink-install
          source install/setup.bash
          cd ..
          python3 scripts/test_ros_transport.py
