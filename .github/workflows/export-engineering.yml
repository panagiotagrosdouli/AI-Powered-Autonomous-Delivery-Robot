name: Export synthetic engineering checkpoints
on:
  push:
    paths:
      - .github/workflows/export-engineering.yml
      - scripts/export_engineering_models.py
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy==2.3.5 onnx==1.17.0 onnxruntime==1.20.1
      - run: python -m scripts.export_engineering_models
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-engineering-onnx-not-real-pedestrians
          path: work/onnx-engineering
